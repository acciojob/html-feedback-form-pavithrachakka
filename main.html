<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<h1>Feedback Form</h1>
	<form method="post">
	<label for="name">Name</label>
	<input type="text" id="name" minlength="3" maxlength="50" required><br>
	<label for="portfolio">Portfolio</label>
	<input id="portfolio" type="url" required><br>
	<label for="favColor">Favorite Color</label>
	<input id="favColor" type="color" required><br>
	<label for="likeness">Likeness</label>
	<input id="likeness" type="range" min="1" max="100" required>
	</form>	
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
